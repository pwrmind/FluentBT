<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>FluentBT — Ровер-доставщик</title>
<style>
  body { font-family:'Segoe UI',sans-serif; background:#1e1e24; color:#eee; padding:14px; margin:0; }
  .main { display:flex; gap:14px; align-items:flex-start; }
  .panel { background:#2a2a32; padding:14px; border-radius:8px; }
  .code { flex:1; min-width:0; display:flex; flex-direction:column; }
  .ctrl { width:420px; flex-shrink:0; }
  pre { background:#111; padding:10px; border-radius:6px; font-family:'Courier New',monospace; font-size:11px; line-height:1.45; color:#a9b7c6; margin:0; white-space:pre; overflow:auto; max-height:300px; }
  h3 { margin:0 0 10px; color:#4fc3f7; border-bottom:1px solid #444; padding-bottom:6px; font-size:15px; }
  .stat { display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px; }
  .stat span { color:#ffb74d; font-weight:bold; }
  button { width:100%; padding:7px; margin-bottom:4px; background:#00897b; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px; }
  button.danger { background:#e53935; }
  button.warn   { background:#fb8c00; }
  button.sim    { background:#3949ab; }
  button.sim.running { background:#c62828; }
  button:hover { filter:brightness(1.15); }
  #logs { background:#111; height:220px; overflow-y:auto; padding:8px; border-radius:6px; font-family:monospace; font-size:11px; color:#81c784; margin-top:6px; }
  .log { border-left:3px solid #81c784; padding-left:6px; margin-bottom:2px; }
  .log.err { color:#e57373; border-color:#e57373; }
  .log.sys { color:#64b5f6; border-color:#64b5f6; }

  .map-grid { display:grid; gap:2px; background:#000; padding:4px; border-radius:6px; margin-bottom:10px; grid-template-columns:repeat(11, 1fr); }
  .map-grid .cell { aspect-ratio:1; background:#1a1a2a; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:16px; position:relative; }
  .cell.base    { background:#1b5e20; }
  .cell.charger { background:#1565c0; }
  .cell.client  { background:#6a1b9a; }
  .cell.rover   { background:#ef6c00 !important; box-shadow:0 0 8px #ffb74d; }
  .cell.rover.charging { background:#43a047 !important; box-shadow:0 0 12px #81c784; animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { opacity:0.85; } to { opacity:1; } }

  .battery-bar { background:#111; border-radius:4px; height:14px; overflow:hidden; margin-bottom:8px; }
  .battery-fill { height:100%; background:linear-gradient(90deg, #e53935, #fb8c00, #4caf50); transition:width 0.3s; }
</style>
</head>
<body>

<div class="main">
  <div class="panel code">
    <h3>Программа ровера</h3>
    <pre id="src"></pre>
    <h3 style="margin-top:12px">Лог</h3>
    <div id="logs"></div>
  </div>

  <div class="panel ctrl">
    <h3>Статус</h3>
    <div class="stat">Батарея: <span id="ui-battery">100</span>%</div>
    <div class="battery-bar"><div class="battery-fill" id="ui-battery-bar" style="width:100%"></div></div>
    <div class="stat">GPS: <span id="ui-gps">OK</span></div>
    <div class="stat">Заказ: <span id="ui-order">нет</span></div>
    <div class="stat">Груз: <span id="ui-cargo">нет</span></div>
    <div class="stat">Флаги: <span id="ui-flags">—</span></div>

    <h3 style="margin-top:14px">Карта</h3>
    <div id="map-grid" class="map-grid"></div>
    <div class="stat" style="font-size:11px; color:#888">
      🏠 база · 🔌 зарядка · 🏢 клиент · 🚚 ровер
    </div>

    <h3 style="margin-top:14px">Симуляция</h3>
    <button id="btn-sim" class="sim" onclick="toggleSim()">▶ Старт</button>
    <button class="warn" onclick="tickOnce()">⏭ Один тик</button>
    <button class="warn" onclick="resetWorld()">🔄 Сброс</button>

    <h3 style="margin-top:14px">События</h3>
    <button onclick="triggerEvent('new-order')">📦 Новый заказ</button>
    <button onclick="triggerEvent('client-out')">👤 Клиент вышел</button>
    <button class="danger" onclick="triggerEvent('client-cancel')">❌ Клиент отменил</button>
    <button class="danger" onclick="triggerEvent('impact')">💥 Удар</button>
    <button class="warn" onclick="triggerEvent('obstacle')">🚧 Препятствие</button>
    <button class="warn" onclick="triggerEvent('low-battery')">🔋 Батарея = 20%</button>
    <button class="warn" onclick="triggerEvent('gps-lost')">📡 Потерять GPS</button>
    <button onclick="triggerEvent('gps-ok')">📡 Восстановить GPS</button>
    <button onclick="triggerEvent('slip')">🛞 Колёса буксуют</button>
    <button onclick="triggerEvent('dispatcher')">🎮 Диспетчер</button>
  </div>
</div>

<script>
// ============================================================
//  FluentBT — ядро (готово к выносу в отдельный модуль)
// ============================================================
const S = { SUCCESS: 'SUCCESS', FAILURE: 'FAILURE', RUNNING: 'RUNNING' };

function extractBlocks(text) {
  const out = []; let depth = 0, cur = '';
  for (const ch of text) {
    if (ch === '[') { if (depth) cur += ch; depth++; }
    else if (ch === ']') {
      if (depth === 0) continue;
      depth--;
      if (!depth) { out.push(cur.trim()); cur = ''; }
      else cur += ch;
    } else if (depth) cur += ch;
  }
  return out;
}

function parseDuration(str) {
  const n = parseFloat(str);
  if (isNaN(n)) return 0;
  if (str.endsWith('ms')) return n / 1000;
  if (str.endsWith('s'))  return n;
  if (str.endsWith('m'))  return n * 60;
  return n;
}

function isConditionExpr(text, reg) {
  if (text.startsWith('not ')) {
    const inner = extractBlocks(text.slice(4))[0] || text.slice(4).trim();
    return isConditionExpr(inner, reg);
  }
  if (text.startsWith('all ') || text.startsWith('any ')) {
    const parts = extractBlocks(text.slice(4));
    return parts.length > 0 && parts.every(p => isConditionExpr(p, reg));
  }
  const m = text.match(/^(?:retry(?::\S+)?|repeat(?::\S+)?|wait:\S+|timeout:\S+)\s+(.+)$/);
  if (m) {
    const inner = extractBlocks(m[1])[0] || m[1].trim();
    return isConditionExpr(inner, reg);
  }
  const e = reg[text];
  return !!(e && e.type === 'condition');
}

class FluentBT {
  constructor(source, registry, options = {}) {
    this.reg = registry;
    this.bb  = options.blackboard ?? {};
    this.now = options.now ?? (() => Date.now());
    this.state   = new Map();
    this.running = new Map();
    this.program = this.parse(source);
  }

  reset() {
    this.state.clear();
    this.running.clear();
  }

  parse(source) {
    const lines = source.split('\n')
      .map(l => l.replace(/\/\/.*$/, '').trim())
      .filter(Boolean);
    const program = [];
    let currentGroup = null;
    let nextId = 0;
    const node = (text) => ({ text, id: ++nextId });
    for (const line of lines) {
      const blocks = extractBlocks(line);
      if (!blocks.length) continue;
      if (blocks.length > 3) throw new Error(`Больше 3 блоков: ${line}`);
      if (blocks.length === 1) {
        if (isConditionExpr(blocks[0], this.reg)) {
          currentGroup = { header: node(blocks[0]), rules: [] };
          program.push(currentGroup);
        } else {
          this._pushRule(program, currentGroup, { cond: null, onTrue: node(blocks[0]), onFalse: null });
        }
      } else if (blocks.length === 2) {
        this._pushRule(program, currentGroup, { cond: node(blocks[0]), onTrue: node(blocks[1]), onFalse: null });
      } else {
        this._pushRule(program, currentGroup, { cond: node(blocks[0]), onTrue: node(blocks[1]), onFalse: node(blocks[2]) });
        currentGroup = null;
      }
    }
    return program;
  }

  _pushRule(program, group, rule) {
    if (group) group.rules.push(rule);
    else program.push({ header: null, rules: [rule] });
  }

  tick() {
    const visited = new Set();
    const result = this._run(visited);
    for (const [id, info] of this.running) {
      if (!visited.has(id)) {
        if (info.abort) try { info.abort(); } catch (e) {}
        this.running.delete(id);
      }
    }
    for (const id of [...this.state.keys()]) {
      if (!visited.has(id)) this.state.delete(id);
    }
    return result;
  }

  _run(visited) {
    for (const g of this.program) {
      if (g.header) {
        visited.add(g.header.id);
        const h = this._eval(g.header, visited);
        if (h === S.FAILURE) continue;
        if (h === S.RUNNING) return S.RUNNING;
        for (const r of g.rules) {
          const s = this._execRule(r, visited);
          if (s === S.SUCCESS) return S.SUCCESS;
          if (s === S.RUNNING) return S.RUNNING;
        }
      } else {
        for (const r of g.rules) {
          const s = this._execRule(r, visited);
          if (s === S.SUCCESS) return S.SUCCESS;
          if (s === S.RUNNING) return S.RUNNING;
        }
      }
    }
    return S.FAILURE;
  }

  _execRule(r, visited) {
    if (r.cond) {
      visited.add(r.cond.id);
      const c = this._eval(r.cond, visited);
      if (c === S.RUNNING) return S.RUNNING;
      if (c === S.SUCCESS) {
        visited.add(r.onTrue.id);
        return this._eval(r.onTrue, visited);
      }
      if (r.onFalse) {
        visited.add(r.onFalse.id);
        return this._eval(r.onFalse, visited);
      }
      return S.FAILURE;
    }
    visited.add(r.onTrue.id);
    return this._eval(r.onTrue, visited);
  }

  _eval(node, visited) {
    const text = node.text.trim();
    const id = node.id;
    visited.add(id);

    if (text.startsWith('not ')) {
      const inner = extractBlocks(text.slice(4))[0] || text.slice(4).trim();
      const s = this._eval({ text: inner, id: `${id}/not` }, visited);
      if (s === S.SUCCESS) return S.FAILURE;
      if (s === S.FAILURE) return S.SUCCESS;
      return s;
    }
    if (text.startsWith('any ')) {
      const parts = extractBlocks(text.slice(4));
      for (let i = 0; i < parts.length; i++) {
        const s = this._eval({ text: parts[i], id: `${id}/any/${i}` }, visited);
        if (s === S.SUCCESS) return S.SUCCESS;
        if (s === S.RUNNING) return S.RUNNING;
      }
      return S.FAILURE;
    }
    if (text.startsWith('all ')) {
      const parts = extractBlocks(text.slice(4));
      for (let i = 0; i < parts.length; i++) {
        const s = this._eval({ text: parts[i], id: `${id}/all/${i}` }, visited);
        if (s === S.FAILURE) return S.FAILURE;
        if (s === S.RUNNING) return S.RUNNING;
      }
      return S.SUCCESS;
    }

    let m = text.match(/^retry(?::(\d+))?\s+(.+)$/);
    if (m) return this._retry(m[1] === undefined ? Infinity : +m[1], m[2], id, visited);
    m = text.match(/^repeat(?::(\d+))?\s+(.+)$/);
    if (m) return this._repeat(m[1] === undefined ? Infinity : +m[1], m[2], id, visited);
    m = text.match(/^wait:(\S+)\s+(.+)$/);
    if (m) return this._wait(parseDuration(m[1]), m[2], id, visited);
    m = text.match(/^timeout:(\S+)\s+(.+)$/);
    if (m) return this._timeout(parseDuration(m[1]), m[2], id, visited);

    const e = this.reg[text];
    if (!e) throw new Error(`Неизвестный блок: ${text}`);
    const result = e.fn(this.bb);
    if (e.abort && result !== S.SUCCESS) {
      this.running.set(id, { abort: () => e.abort(this.bb) });
    } else {
      this.running.delete(id);
    }
    return result;
  }

  _retry(n, innerText, id, visited) {
    const inner = extractBlocks(innerText)[0] || innerText.trim();
    const s = this._eval({ text: inner, id: `${id}/retry/child` }, visited);
    if (s === S.SUCCESS) { this.state.delete(id); return S.SUCCESS; }
    if (s === S.FAILURE) {
      if (n === Infinity) return S.RUNNING;
      if (!this.state.has(id)) this.state.set(id, { count: 0 });
      const st = this.state.get(id);
      st.count++;
      if (st.count < n) return S.RUNNING;
      this.state.delete(id);
      return S.FAILURE;
    }
    return s;
  }

  _repeat(n, innerText, id, visited) {
    const inner = extractBlocks(innerText)[0] || innerText.trim();
    const s = this._eval({ text: inner, id: `${id}/repeat/child` }, visited);
    if (s === S.FAILURE) { this.state.delete(id); return S.FAILURE; }
    if (s === S.SUCCESS) {
      if (n === Infinity) return S.RUNNING;
      if (!this.state.has(id)) this.state.set(id, { count: 0 });
      const st = this.state.get(id);
      st.count++;
      if (st.count >= n) { this.state.delete(id); return S.SUCCESS; }
      return S.RUNNING;
    }
    return s;
  }

  _wait(sec, innerText, id, visited) {
    const inner = extractBlocks(innerText)[0] || innerText.trim();
    if (!this.state.has(id)) this.state.set(id, { deadline: this.now() + sec * 1000 });
    const st = this.state.get(id);
    if (this.now() < st.deadline) return S.RUNNING;
    this.state.delete(id);
    return this._eval({ text: inner, id: `${id}/wait/child` }, visited);
  }

  _timeout(sec, innerText, id, visited) {
    const inner = extractBlocks(innerText)[0] || innerText.trim();
    if (!this.state.has(id)) this.state.set(id, { deadline: this.now() + sec * 1000 });
    const st = this.state.get(id);
    if (this.now() >= st.deadline) { this.state.delete(id); return S.FAILURE; }
    const s = this._eval({ text: inner, id: `${id}/timeout/child` }, visited);
    if (s !== S.RUNNING) this.state.delete(id);
    return s;
  }
}

// ============================================================
//  МИР
// ============================================================
const MAP = {
  base:    { x: 1, y: 2 },
  charger: { x: 1, y: 0 },
  client:  { x: 9, y: 2 },
};
const MAP_W = 11, MAP_H = 5;

const world = {
  rover:           { x: MAP.base.x, y: MAP.base.y },
  battery:         100,
  gpsOk:           true,
  impact:          false,
  obstacleNear:    false,
  wheelsSlipping:  false,
  wheelsRetries:   0,
  frozen:          false,
  sirenOn:         false,
  orderInProgress: false,
  orderIssued:     false,
  orderCancelled:  false,
  dispatcherControl: false,
  cargoInside:     true,
  clientOut:       false,
  routeToClient:   false,
  routeToCharger:  false,
};

function at(pos) {
  return world.rover.x === pos.x && world.rover.y === pos.y;
}

function moveToward(target) {
  if (at(target)) return false;
  const dx = Math.sign(target.x - world.rover.x);
  const dy = Math.sign(target.y - world.rover.y);
  if (dx !== 0) world.rover.x += dx;
  else if (dy !== 0) world.rover.y += dy;
  return true;
}

// ============================================================
//  РЕГИСТР
// ============================================================
const registry = {
  // --- Условия ---
  "ДатчикУдараАктивирован":   { type:'condition', fn: () => world.impact ? S.SUCCESS : S.FAILURE },
  "ПрепятствиеБлизко":        { type:'condition', fn: () => world.obstacleNear ? S.SUCCESS : S.FAILURE },
  "БатареяКритическая":       { type:'condition', fn: () => world.battery < 30 ? S.SUCCESS : S.FAILURE },
  "НаЗарядке":                { type:'condition', fn: () => at(MAP.charger) ? S.SUCCESS : S.FAILURE },
  "СигналGPSВНорме":          { type:'condition', fn: () => world.gpsOk ? S.SUCCESS : S.FAILURE },
  "КолесаБуксуют":            { type:'condition', fn: () => world.wheelsSlipping ? S.SUCCESS : S.FAILURE },
  "РоверНаБазе":              { type:'condition', fn: () => at(MAP.base) ? S.SUCCESS : S.FAILURE },
  "ПрибылВТочкуДоставки":     { type:'condition', fn: () => at(MAP.client) ? S.SUCCESS : S.FAILURE },
  "КлиентВышел":              { type:'condition', fn: () => world.clientOut ? S.SUCCESS : S.FAILURE },
  "ЗаказВыдан":               { type:'condition', fn: () => world.orderIssued ? S.SUCCESS : S.FAILURE },
  "ЗаказОтмененКлиентом":     { type:'condition', fn: () => world.orderCancelled ? S.SUCCESS : S.FAILURE },
  "УправлениеДиспетчером":    { type:'condition', fn: () => world.dispatcherControl ? S.SUCCESS : S.FAILURE },
  "ЗаказВПути":               { type:'condition', fn: () => world.orderInProgress ? S.SUCCESS : S.FAILURE },
  "ГрузВнутри":               { type:'condition', fn: () => world.cargoInside ? S.SUCCESS : S.FAILURE },
  "МаршрутПостроенДоКлиента": { type:'condition', fn: () => world.routeToClient ? S.SUCCESS : S.FAILURE },
  "МаршрутПостроенДоЗарядки": { type:'condition', fn: () => world.routeToCharger ? S.SUCCESS : S.FAILURE },
  "ОжиданиеЗаказа":           { type:'condition', fn: () =>
    (!world.orderInProgress && !world.orderIssued && !world.orderCancelled && !world.dispatcherControl)
      ? S.SUCCESS : S.FAILURE },

  // --- Действия ---
  "ЗаблокироватьКолеса": { type:'action', fn: () => {
    if (!world.frozen) log('🔒 Колёса заблокированы', 'err');
    world.frozen = true; return S.SUCCESS;
  }},
  "ВключитьСирену": { type:'action', fn: () => {
    if (!world.sirenOn) log('🚨 Сирена включена', 'err');
    world.sirenOn = true; return S.SUCCESS;
  }},
  "ОтправитьСигналSOS": { type:'action', fn: () => {
    if (world.impact) {
      log('📡 SOS отправлен', 'err');
      world.impact = false;
    }
    return S.SUCCESS;
  }},

  "ЭкстренноеТорможение": { type:'action', fn: () => {
    if (!world.frozen) log('🛑 Экстренное торможение');
    world.frozen = true; return S.SUCCESS;
  }},

  "НачатьЗарядку": { type:'action', fn: () => {
    world.battery = Math.min(100, world.battery + 10);
    if (world.battery >= 100) {
      log('🔌 Заряжено до 100%', 'sys');
      return S.SUCCESS;
    }
    return S.RUNNING;
  }},
  "ПостроитьМаршрутДоЗарядки": { type:'action', fn: () => {
    if (!world.routeToCharger) log('🗺️ Маршрут до зарядки');
    world.routeToCharger = true; return S.SUCCESS;
  }},
  "ЕхатьНаЗарядку": { type:'action', fn: () => {
    if (world.frozen) return S.FAILURE;
    if (moveToward(MAP.charger)) world.battery = Math.max(0, world.battery - 2);
    return S.SUCCESS;
  }},

  "ВключитьЛидары": { type:'action', fn: () => S.SUCCESS },
  "ОтползтиНазадПоЛидарам": { type:'action', fn: () => {
    if (world.frozen) return S.FAILURE;
    const before = { ...world.rover };
    moveToward(MAP.base);
    if (before.x === world.rover.x && before.y === world.rover.y) return S.FAILURE;
    log('⬅️ Отполз назад по лидарам');
    return S.SUCCESS;
  }},
  "ОстановитьсяЖдатьСигнал": { type:'action', fn: () => S.SUCCESS },

  "ВключитьПовышеннуюПередачу": { type:'action', fn: () => {
    log('⚙️ Повышенная передача');
    return S.SUCCESS;
  }},
  "РаскачкаВпередНазад": { type:'action', fn: () => {
    world.wheelsRetries++;
    if (world.wheelsRetries >= 2) {
      world.wheelsSlipping = false;
      world.wheelsRetries = 0;
      log('🛞 Выбрались!', 'sys');
      return S.SUCCESS;
    }
    log(`🛞 Раскачка ${world.wheelsRetries}/2`);
    return S.FAILURE;
  }},
  "Остановиться": { type:'action', fn: () => S.SUCCESS },
  "ВызватьДиспетчераУдаленно": { type:'action', fn: () => {
    if (!world.dispatcherControl) log('📞 Диспетчер вызван', 'err');
    world.dispatcherControl = true;
    return S.SUCCESS;
  }},

  "ВстатьВРежимОжидания": { type:'action', fn: () => {
    if (world.orderIssued || world.orderCancelled || world.dispatcherControl) {
      log('💤 Ровер в режиме ожидания', 'sys');
    }
    world.orderIssued = false;
    world.orderCancelled = false;
    world.dispatcherControl = false;
    world.routeToClient = false;
    world.routeToCharger = false;
    world.frozen = false;
    world.sirenOn = false;
    return S.SUCCESS;
  }},
  "ЕхатьНаБазу": { type:'action', fn: () => {
    if (world.frozen) return S.FAILURE;
    if (moveToward(MAP.base)) world.battery = Math.max(0, world.battery - 2);
    return S.SUCCESS;
  }},

  "ОткрытьКрышкуВыдатьЗаказ": { type:'action', fn: () => {
    world.orderIssued = true;
    world.orderInProgress = false;
    world.cargoInside = false;
    world.clientOut = false;
    world.routeToClient = false;
    log('📦 Заказ выдан!', 'sys');
    return S.SUCCESS;
  }},
  "ПодатьЗвуковойСигнал": { type:'action', fn: () => {
    log('🔔 Бип (ждём клиента)');
    return S.SUCCESS;
  }},

  "ПостроитьМаршрутДоКлиента": { type:'action', fn: () => {
    if (!world.routeToClient) log('🗺️ Маршрут до клиента');
    world.routeToClient = true;
    return S.SUCCESS;
  }},
  "ЕхатьПоМаршруту": { type:'action', fn: () => {
    if (world.frozen) return S.FAILURE;
    if (moveToward(MAP.client)) world.battery = Math.max(0, world.battery - 2);
    return S.SUCCESS;
  }},
};

// ============================================================
//  ПРОГРАММА
// ============================================================
const PROGRAM = `// Ровер-доставщик — программа

// 1. Крэш
[ДатчикУдараАктивирован]
[all [ЗаблокироватьКолеса] [ВключитьСирену] [ОтправитьСигналSOS]]

// 2. Экстренное торможение
[ПрепятствиеБлизко]
[ЭкстренноеТорможение]

// 3. Критическая батарея — заряжаемся
[БатареяКритическая]
[НаЗарядке] [НачатьЗарядку]

// 4. Критическая батарея — едем на зарядку
[all [БатареяКритическая] [not [НаЗарядке]]]
[МаршрутПостроенДоЗарядки] [ЕхатьНаЗарядку] [ПостроитьМаршрутДоЗарядки]

// 5. GPS потерян
[not [СигналGPSВНорме]]
[all [ВключитьЛидары] [retry:3 [wait:1s [ОтползтиНазадПоЛидарам]]]] [ОстановитьсяЖдатьСигнал]

// 6. Буксовка
[КолесаБуксуют]
[retry:3 [all [ВключитьПовышеннуюПередачу] [РаскачкаВпередНазад]]] [all [Остановиться] [ВызватьДиспетчераУдаленно]]

// 7. Заказ завершён — на базу
[any [УправлениеДиспетчером] [ЗаказВыдан] [ЗаказОтмененКлиентом]]
[РоверНаБазе] [ВстатьВРежимОжидания] [ЕхатьНаБазу]

// 8. Прибыл к клиенту
[all [ПрибылВТочкуДоставки] [not [ЗаказВыдан]]]
[КлиентВышел] [ОткрытьКрышкуВыдатьЗаказ] [timeout:10s [repeat [wait:1s [ПодатьЗвуковойСигнал]]]]

// 9. Доставка в процессе
[all [ЗаказВПути] [ГрузВнутри]]
[not [МаршрутПостроенДоКлиента]] [ПостроитьМаршрутДоКлиента]
[МаршрутПостроенДоКлиента] [retry [ЕхатьПоМаршруту]]

// 10. Ожидание
[ОжиданиеЗаказа]
[ЕхатьНаБазу]`;

// ============================================================
//  СИМУЛЯЦИЯ
// ============================================================
let bt = null;
let simTimer = null;
let tickCount = 0;

const TICK_MS = 300;

function log(m, cls) {
  const c = document.getElementById('logs');
  const t = new Date().toLocaleTimeString('ru-RU', { hour12: false });
  c.insertAdjacentHTML('beforeend', `<div class="log ${cls || ''}">[${t}] ${m}</div>`);
  while (c.children.length > 120) c.removeChild(c.firstChild);
  c.scrollTop = c.scrollHeight;
}

function renderMap() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      const isRover = x === world.rover.x && y === world.rover.y;
      const isBase = x === MAP.base.x && y === MAP.base.y;
      const isCharger = x === MAP.charger.x && y === MAP.charger.y;
      const isClient = x === MAP.client.x && y === MAP.client.y;

      if (isBase) c.classList.add('base');
      else if (isCharger) c.classList.add('charger');
      else if (isClient) c.classList.add('client');

      if (isRover) {
        c.classList.add('rover');
        if (isCharger) c.classList.add('charging');
        c.textContent = world.frozen ? '🚫' : (isCharger ? '🔋' : '🚚');
      } else if (isBase) c.textContent = '🏠';
      else if (isCharger) c.textContent = '🔌';
      else if (isClient) c.textContent = world.orderInProgress ? '📍' : '🏢';

      grid.appendChild(c);
    }
  }
}

function renderStatus() {
  document.getElementById('ui-battery').textContent = world.battery;
  document.getElementById('ui-battery-bar').style.width = world.battery + '%';
  document.getElementById('ui-gps').textContent = world.gpsOk ? 'OK' : 'НЕТ';
  document.getElementById('ui-gps').style.color = world.gpsOk ? '#ffb74d' : '#e57373';

  const order = world.orderInProgress ? 'в пути'
    : world.orderIssued ? 'выдан'
    : world.orderCancelled ? 'отменён'
    : 'нет';
  document.getElementById('ui-order').textContent = order;

  document.getElementById('ui-cargo').textContent = world.cargoInside ? 'внутри' : 'нет';

  const flags = [];
  if (world.impact) flags.push('УДАР');
  if (world.obstacleNear) flags.push('препятствие');
  if (world.wheelsSlipping) flags.push('буксует');
  if (world.frozen) flags.push('frozen');
  if (world.sirenOn) flags.push('сирена');
  if (world.dispatcherControl) flags.push('диспетчер');
  document.getElementById('ui-flags').textContent = flags.length ? flags.join(', ') : '—';
}

function render() {
  renderStatus();
  renderMap();
}

function tickOnce() {
  if (!bt) return;
  tickCount++;
  try { bt.tick(); } catch (e) { log('⚠️ ' + e.message, 'err'); }
  render();
}

function startSim() {
  if (simTimer) return;
  simTimer = setInterval(tickOnce, TICK_MS);
  const b = document.getElementById('btn-sim');
  b.textContent = '⏸ Стоп'; b.classList.add('running');
  log('▶ Симуляция запущена', 'sys');
}
function stopSim() {
  if (!simTimer) return;
  clearInterval(simTimer); simTimer = null;
  const b = document.getElementById('btn-sim');
  b.textContent = '▶ Старт'; b.classList.remove('running');
  log('⏸ Симуляция остановлена', 'sys');
}
function toggleSim() { simTimer ? stopSim() : startSim(); }

function resetWorld() {
  if (simTimer) stopSim();
  world.rover = { x: MAP.base.x, y: MAP.base.y };
  world.battery = 100;
  world.gpsOk = true;
  world.impact = false;
  world.obstacleNear = false;
  world.wheelsSlipping = false;
  world.wheelsRetries = 0;
  world.frozen = false;
  world.sirenOn = false;
  world.orderInProgress = false;
  world.orderIssued = false;
  world.orderCancelled = false;
  world.dispatcherControl = false;
  world.cargoInside = true;
  world.clientOut = false;
  world.routeToClient = false;
  world.routeToCharger = false;
  if (bt) bt.reset();
  tickCount = 0;
  log('🔄 Мир сброшен', 'sys');
  render();
}

// ============================================================
//  СОБЫТИЯ (переименовано из event → triggerEvent)
// ============================================================
function triggerEvent(name) {
  switch (name) {
    case 'new-order':
      if (world.orderInProgress) { log('Заказ уже в пути', 'err'); break; }
      world.orderInProgress = true;
      world.orderIssued = false;
      world.orderCancelled = false;
      world.dispatcherControl = false;
      world.cargoInside = true;
      world.clientOut = false;
      world.routeToClient = false;
      log('📦 Новый заказ получен', 'sys');
      break;

    case 'client-out':
      if (!at(MAP.client)) { log('Ровер ещё не у клиента', 'err'); break; }
      world.clientOut = true;
      log('👤 Клиент вышел', 'sys');
      break;

    case 'client-cancel':
      world.orderCancelled = true;
      world.orderInProgress = false;
      world.cargoInside = false;
      world.clientOut = false;
      log('❌ Клиент отменил заказ', 'err');
      break;

    case 'impact':
      world.impact = true;
      log('💥 Удар!', 'err');
      break;

    case 'obstacle':
      world.obstacleNear = !world.obstacleNear;
      log(world.obstacleNear ? '🚧 Препятствие близко' : '🚧 Препятствие убрано');
      break;

    case 'low-battery':
      world.battery = 20;
      log('🔋 Батарея разряжена до 20%', 'err');
      break;

    case 'gps-lost':
      world.gpsOk = false;
      log('📡 GPS потерян', 'err');
      break;

    case 'gps-ok':
      world.gpsOk = true;
      log('📡 GPS восстановлен', 'sys');
      break;

    case 'slip':
      world.wheelsSlipping = true;
      world.wheelsRetries = 0;
      log('🛞 Колёса буксуют', 'err');
      break;

    case 'dispatcher':
      world.dispatcherControl = true;
      log('🎮 Диспетчер взял управление', 'err');
      break;
  }
  render();
}

// ============================================================
//  ИНИТ
// ============================================================
try {
  document.getElementById('src').textContent = PROGRAM;
  bt = new FluentBT(PROGRAM, registry);
  render();
  log('🎬 FluentBT — Ровер-доставщик загружен', 'sys');
  log('💡 Нажмите «📦 Новый заказ» → «▶ Старт», чтобы увидеть полный цикл доставки', 'sys');
  log('💡 События слева (удар, GPS, буксовка) прерывают текущее поведение', 'sys');
} catch (e) {
  log('💥 Ошибка: ' + e.message, 'err');
}
</script>
